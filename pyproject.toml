[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coding-assistant"
version = "0.1.0"
description = "AI coding assistant that reads, explains and edits code"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["anthropic", "python-dotenv"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ai-assist = "assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
